      - name: Verify screenshots exist
        run: |
          for platform in linux linux-arm64 macos windows; do
            for f in infoview-goals.png interaction-error.png project-exercise.png; do
              test -f "site/$platform/$f" || { echo "::warning::Missing screenshot: $platform/$f"; }
            done
          done

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  ci:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - build-windows
      - build-linux
      - build-linux-arm64
      - build-macos-arm64
      - test-linux-gui
      - test-linux-arm64-gui
      - test-macos-gui
      - test-macos-gui-fresh
      - test-windows-gui
    steps:
      - name: Check all jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Some required jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
